; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino

lib_deps = 
	adafruit/Adafruit ADS1X15@^2.4.0
	chris--a/Keypad@^3.1.1
	adafruit/Adafruit MCP4725@^2.0.0
	marcoschwartz/LiquidCrystal_I2C@^1.1.4

build_flags = -mcall-prologues

; Same firmware, uploaded through the ICSP header with a USBasp (overwrites the bootloader).
; If the chip is not detected, add "-B" and "125kHz" (slow SCK) to upload_flags.
[env:nanoatmega328_icsp]
extends = env:nanoatmega328
upload_protocol = custom
upload_port = usb
upload_flags =
	-C
	${platformio.packages_dir}/tool-avrdude/avrdude.conf
	-p
	$BOARD_MCU
	-P
	$UPLOAD_PORT
	-c
	usbasp
upload_command = avrdude $UPLOAD_FLAGS -U flash:w:$SOURCE:i

; Headless build: no LCD and no keypad needed. LCD and Keypad are replaced by stubs from headless_stubs/
; (the ADC, DAC, EEPROM and the encoder are the real ones). The firmware boots straight into the serial
; remote mode, 9600 baud, commands end with a newline: CC <A>, CP <W>, CR <ohm>, ON, OFF, MEAS?, HELP.
; The encoder button switches the load OFF. Upload through the bootloader (USB).
[env:headless]
extends = env:nanoatmega328
lib_ignore = LiquidCrystal_I2C, Keypad
build_flags = -mcall-prologues -DHEADLESS -I$PROJECT_DIR/headless_stubs

; Headless build for the PC desktop application (desktop_app/): same hardware as "headless", but the serial
; protocol is the battery-mode one the application speaks: 'o' load on/off, 'a<A>' set current, 'c<V>' cutoff
; voltage (0 = none), 'r' reset, and "m;..." telemetry lines. The encoder button and input > MAX_VOLTAGE+1 switch the load OFF.
[env:headless-app]
extends = env:headless
build_flags = -mcall-prologues -DHEADLESS -DHEADLESS_APP -I$PROJECT_DIR/headless_stubs

; Build for SimulIDE (or any board without the I2C chips): LCD, ADC, DAC, RTC and EEPROM are replaced by
; stubs from sim_stubs/ and the firmware goes straight into the PC remote mode (serial protocol, see include/remote.hh).
; The simulated input is 24 V and the measured current follows the commanded current.
[env:simulide]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps = chris--a/Keypad@^3.1.1
lib_ignore = MCP79410Timer, Adafruit ADS1X15, Adafruit MCP4725, LiquidCrystal_I2C, Adafruit BusIO
build_flags = -mcall-prologues -DSIM_TEST -I$PROJECT_DIR/sim_stubs
